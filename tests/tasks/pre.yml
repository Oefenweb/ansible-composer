# pre test file
---
- name: install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - "php{{ (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] is version('8', '<=')) | ternary('5', '') }}-cli"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
